<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webapp.cashflow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>webapp.cashflow</h1>
    <span class="account-summary" id="account-summary"></span>
  </header>

  <nav>
    <button data-tab="forecast" class="active">Verlauf</button>
    <button data-tab="entries">Einnahmen &amp; Ausgaben</button>
    <button data-tab="categories">Kategorien</button>
    <button data-tab="account">Konto &amp; Daten</button>
  </nav>

  <main>
    <section class="tab active" id="tab-forecast"></section>
    <section class="tab" id="tab-entries"></section>
    <section class="tab" id="tab-categories"></section>
    <section class="tab" id="tab-account"></section>
  </main>

  <dialog id="entry-dialog"></dialog>
  <dialog id="welcome-dialog" class="welcome"></dialog>

  <script type="module" src="app.js"></script>

</html>
